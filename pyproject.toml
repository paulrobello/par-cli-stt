[project]
name = "par-cli-stt"
dynamic = [
    "version",
]
description = "PAR STT — Streaming speech-to-text library and CLI supporting ElevenLabs Scribe and Deepgram Nova-3"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Paul Robello", email = "probello@gmail.com" },
]
maintainers = [
    { name = "Paul Robello", email = "probello@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Typing :: Typed",
]
keywords = [
    "stt",
    "speech-to-text",
    "transcription",
    "elevenlabs",
    "deepgram",
    "scribe",
    "nova-3",
    "cli",
    "streaming",
    "library",
]
dependencies = [
    "httpx>=0.28.1,<1.0",
    "python-dotenv>=1.2.2,<2.0",
    "typer>=0.24.2,<1.0",
    "rich>=15.0.0,<20.0",
    "platformdirs>=4.9.6,<5.0",
    "pyyaml>=6.0.3,<7.0",
    "websockets>=13,<15",
    "soundfile>=0.13.1,<1.0",
    "elevenlabs>=2.44.0,<3.0",
]

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/paulrobello/par-cli-stt"
Documentation = "https://github.com/paulrobello/par-cli-stt/blob/main/README.md"
Repository = "https://github.com/paulrobello/par-cli-stt"
Issues = "https://github.com/paulrobello/par-cli-stt/issues"
Discussions = "https://github.com/paulrobello/par-cli-stt/discussions"
Wiki = "https://github.com/paulrobello/par-cli-stt/wiki"

[project.scripts]
par-stt = "par_stt.cli.stt_cli:_run_cli"

[build-system]
requires = [
    "hatchling",
    "wheel",
]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.4.4",
    "pyright>=1.1.409",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "hatchling>=1.29.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-v --cov=par_stt --cov-report=term-missing"

[tool.hatch.version]
path = "par_stt/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "par_stt",
]
include = [
    "py.typed",
    "**/*.py",
    "par_stt/data/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "par_stt",
    "par_stt/data/**/*",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "*.pyc",
    "__pycache__",
    "*.so",
    "*.dylib",
]
